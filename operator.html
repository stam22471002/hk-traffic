<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-z3sETt2ll6qn8GsAPkQZCdgNUNnBhPVGJlkgLNGKyeQ=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>ParkSmart 營運商後台</title>
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --ink: #1c2430; --muted: #66707d; --line: #e3e7ed; --soft: #f0f3f7;
  --accent: #0b63c5; --accent-ink: #ffffff; --accent-soft: #e6f0fb;
  --ok: #1e8e3e; --ok-soft: #e6f4ea; --warn: #b26a00; --warn-soft: #fff4e0; --bad: #c62828; --bad-soft: #fdecea;
  --radius: 12px; --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Segoe UI", "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }

/* 頂部 */
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 16px; }
.brand small { font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; font-size: 12px; }
.top .sp { flex: 1; }
.who { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
.tabs { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
.tabs button { background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .badge { background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; margin-left: 4px; }

main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { font-size: 22px; margin: 4px 0 14px; }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head h2 { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.narrow { max-width: 460px; margin: 30px auto; }

/* 數字格 */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 640px) { .kpis.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi.ok { background: var(--ok-soft); } .kpi.warn { background: var(--warn-soft); } .kpi.bad { background: var(--bad-soft); }

/* 表格 */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: var(--soft); font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 14px; text-align: center; }

/* 標籤 */
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.ok, .pill.approved, .pill.checked_in { background: var(--ok-soft); color: var(--ok); }
.pill.warn, .pill.pending, .pill.called, .pill.reserved, .pill.waiting { background: var(--warn-soft); color: var(--warn); }
.pill.bad, .pill.rejected { background: var(--bad-soft); color: var(--bad); }

/* 表單 */
.form { display: grid; gap: 12px; }
.form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.f input, label.f select, label.f textarea, .inp { width: 100%; border: 1px solid #cfd6df; border-radius: 8px; padding: 9px 11px; background: #fff; color: var(--ink); font-size: 15px; }
label.f input:focus, label.f select:focus, .inp:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.check input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--accent); flex-shrink: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 8px; padding: 9px 16px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.55; cursor: default; filter: none; }
.btn.ghost { background: #fff; color: var(--ink); border-color: #cfd6df; }
.btn.ok { background: var(--ok); } .btn.bad { background: var(--bad); } .btn.warn { background: #e37400; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: var(--bad); font-size: 14px; }
.err:empty { display: none; }
.okmsg { color: var(--ok); font-size: 14px; }
.okmsg:empty { display: none; }
.links { display: flex; justify-content: space-between; font-size: 14px; margin-top: 12px; }
.links a { cursor: pointer; }
details.box { background: var(--soft); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
details.box summary { cursor: pointer; color: var(--ink); }
details.box p { margin: 6px 0; }

/* 提示訊息 */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: 0.2s; background: #1c2430; color: #fff;
  padding: 10px 16px; border-radius: 10px; z-index: 100; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); pointer-events: none; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
.status-card { text-align: center; padding: 28px 16px; }
.status-card .big { font-size: 40px; }


</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="logo">P</span>ParkSmart <small>營運商後台</small></div>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button class="btn ghost sm" id="logout" hidden>登出</button>
    <a class="btn ghost sm" href="./">用家網站</a>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"><div class="loading">載入緊…</div></main>
<script>
// =====================================================================
// ParkSmart 後台共用：設定、登入、工具
// =====================================================================
// Supabase 設定：自動讀同一個資料夾入面 index.html 嘅 PS_URL／PS_KEY，呢個檔唔使改。
// （呢頁有 Content-Security-Policy：改咗入面嘅 JavaScript，瀏覽器會拒絕執行）
let PS_URL = '';
let PS_KEY = '';
const PS_SDK = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js';
const PS_SDK_SRI = 'sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK';
const PS_PDPO_VERSION = '2026-11';
const MAIN_URL = new URL('./', location.href).href;   // 用家網站
const P = { sb: null, session: null };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = x => { const n = +x || 0; return n % 1 ? n.toFixed(1) : String(n); };
const money = x => '$' + (+x || 0).toLocaleString('en-HK', { minimumFractionDigits: 0, maximumFractionDigits: 1 });
const hhmm = t => t ? new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Hong_Kong' }) : '—';
const dmy = t => t ? new Date(t).toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'Asia/Hong_Kong' }) : '—';
const dt = t => t ? `${dmy(t)} ${hhmm(t)}` : '—';
const formData = f => Object.fromEntries(new FormData(f).entries());
const STATUS = { pending: '審批中', approved: '已批准', rejected: '已拒絕', waiting: '排隊中', called: '已叫號', reserved: '已預約', checked_in: '泊緊',
  completed: '完成', cancelled: '取消', no_show: '失約', expired: '過期', arrived: '已到' };
const pill = s => `<span class="pill ${esc(s)}">${esc(STATUS[s] || s)}</span>`;

function toast(msg, ms = 2600) {
  let t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), ms);
}

const PS_ERR = {
  'PS:LOGIN': '請先登入', 'PS:CONSENT': '請先同意私隱政策', 'PS:RATE': '操作得太密，請遲啲再試', 'PS:BAD_INPUT': '資料唔啱，請再檢查',
  'PS:FORBIDDEN': '你冇權限做呢樣嘢', 'PS:NOT_FOUND': '搵唔到', 'PS:CHANGED': '狀態啱啱變咗，請重新整理',
  'PS:BAD_EMAIL': '電郵格式唔啱', 'PS:BAD_PHONE': '電話號碼格式唔啱', 'PS:ALREADY': '你已經申請咗（審批中或者已批准）',
  'PS:NOT_APPROVED': '要等管理員批准咗先可以用', 'PS:BAD_ROWS': '檔案冇資料，或者多過 200 行', 'PS:HAS_BOOKINGS': '有人預約緊或者排緊隊，暫時唔可以停用',
  'PS:ROW_INVALID': '有一行資料已經唔啱（例如運輸署編號俾人用咗），請拒絕後叫營運商重新上載',
  'PS:BAD_CODE': '優惠碼要 4 至 20 個英文字母或數字', 'PS:CODE_TAKEN': '呢個優惠碼已經有人用，請換一個', 'PS:TOO_MANY': '數量已經到上限',
  'PS:NO_LOCATION': '搵唔到呢個停車場', 'PS:BAD_PLATE': '車牌格式唔啱', 'PS:NAME': '名稱要 2 至 30 個字'
};
const PS_AUTH_ERR = [
  [/invalid login credentials/i, '電郵或者密碼唔啱'], [/email not confirmed/i, '未確認電郵：請先去郵箱撳確認連結'],
  [/password should be at least|weak password|password is too weak/i, '密碼太弱：最少 8 個字，要有英文字母同數字'],
  [/rate limit|too many requests/i, '操作得太密，請遲啲再試'], [/only request this after/i, '請等一分鐘再試'],
  [/invalid api key/i, 'Supabase key 唔啱：請檢查 index.html 入面嘅 PS_KEY'], [/failed to fetch|network/i, '連唔到伺服器，請檢查網絡']
];
function msgOf(e) {
  const m = String(e?.message || e || '');
  const k = (m.match(/PS:[A-Z_]+/) || [])[0];
  if (k) return PS_ERR[k] || k;
  const hit = PS_AUTH_ERR.find(([re]) => re.test(m));
  return hit ? hit[1] : (m || '出錯，請再試');
}
async function rpc(fn, args) {
  const { data, error } = await P.sb.rpc(fn, args || {});
  if (error) throw new Error(msgOf(error));
  return data;
}
async function busy(btn, fn) {
  if (!btn || btn.disabled) return;
  const t = btn.textContent;
  btn.disabled = true; btn.textContent = '處理緊…';
  try { return await fn(); } finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = t; } }
}
function download(name, text, type = 'text/csv;charset=utf-8') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([type.startsWith('text/csv') ? '﻿' + text : text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const csvCell = v => /[",\n]/.test(String(v ?? '')) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? '');

// 讀 CSV（支援引號、逗號、換行；第一行係標題）
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const clean = rows.filter(r => r.some(x => x.trim() !== ''));
  if (!clean.length) return [];
  const head = clean[0].map(h => h.trim().toLowerCase());
  return clean.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}

// ---------------------------------------------------------------------
// 開始：讀設定 → 載入 Supabase → 登入狀態
// ---------------------------------------------------------------------
async function loadConfig() {
  if (PS_URL && PS_KEY) return;
  const html = await fetch(new URL('index.html', location.href), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').catch(() => '');
  PS_URL = PS_URL || (html.match(/const PS_URL = '([^']+)'/) || [])[1] || '';
  PS_KEY = PS_KEY || (html.match(/const PS_KEY = '([^']+)'/) || [])[1] || '';
}
function loadSdk() {
  if (window.supabase?.createClient) return Promise.resolve();
  return new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = PS_SDK; s.integrity = PS_SDK_SRI; s.crossOrigin = 'anonymous';
    s.onload = ok; s.onerror = () => bad(new Error('載入唔到登入元件'));
    document.head.appendChild(s);
  });
}
function cleanUrl() {
  const u = new URL(location.href), h = new URLSearchParams(u.hash.slice(1));
  const err = u.searchParams.get('error_description') || h.get('error_description');
  if (err) toast('⚠️ ' + (/expired|invalid/i.test(err) ? '條連結過咗期或者用過咗，請再試一次' : err), 6000);
  let changed = false;
  ['code', 'error', 'error_code', 'error_description'].forEach(k => { if (u.searchParams.has(k)) { u.searchParams.delete(k); changed = true; } });
  if (h.has('error') || h.has('access_token')) { u.hash = ''; changed = true; }
  if (changed) history.replaceState(null, '', u.toString());
}

// opts: { title, intro, onReady(), onSignedOut() }
async function portalStart(opts) {
  const app = $('app');
  try {
    await loadConfig();
    if (!PS_URL || !PS_KEY) { app.innerHTML = `<div class="card narrow">未設定好 Supabase：請先喺同一個資料夾嘅 <b>index.html</b> 填好 <code>PS_URL</code> 同 <code>PS_KEY</code>。</div>`; return; }
    await loadSdk();
    P.sb = window.supabase.createClient(PS_URL, PS_KEY, { auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    P.sb.auth.onAuthStateChange((evt, session) => {
      P.session = session;
      if (evt === 'PASSWORD_RECOVERY') setTimeout(() => renderAuth(opts, 'newpass'), 200);
      if (evt === 'SIGNED_OUT') setTimeout(() => { renderWho(); renderAuth(opts, 'login'); opts.onSignedOut?.(); }, 0);
    });
    P.session = (await P.sb.auth.getSession()).data.session;
    cleanUrl();
  } catch (e) { app.innerHTML = `<div class="card narrow err">${esc(msgOf(e))}</div>`; return; }
  renderWho();
  if (P.session) opts.onReady(); else renderAuth(opts, 'login');
}
function renderWho() {
  const w = $('who'), lo = $('logout');
  if (w) w.textContent = P.session?.user?.email || '';
  if (lo) { lo.hidden = !P.session; lo.onclick = async () => { await P.sb.auth.signOut().catch(() => {}); P.session = null; toast('已登出'); }; }
}

const PRIVACY = `<details class="box"><summary>私隱政策（重點）</summary>
  <p>收集：電郵、名稱、聯絡電話、你提交嘅公司／商戶同停車場資料。用途：審批、營運停車場或者優惠券、防止濫用。</p>
  <p>保護：密碼經雜湊處理；數據庫用 Row Level Security，每個帳戶只睇到自己有權睇嘅資料；所有操作都有審計記錄。</p>
  <p>存放：Supabase 雲端數據庫（新加坡）。你可以喺用家網站「帳戶 → 私隱」下載或者刪除自己嘅資料（《個人資料（私隱）條例》第 486 章）。</p>
  <p>呢個係 University of West London 畢業專題嘅原型系統。</p></details>`;

function pwProblem(pw, email) {
  if (pw.length < 8) return '密碼最少 8 個字';
  if (!/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) return '密碼要有英文字母同數字';
  if (email && pw.toLowerCase().includes(email.split('@')[0].toLowerCase())) return '密碼唔好包含電郵名';
  return '';
}

function renderAuth(opts, view) {
  const app = $('app');
  const redirect = location.origin + location.pathname;
  const links = (...ls) => `<div class="links">${ls.map(([v, t]) => `<a data-v="${v}">${t}</a>`).join('')}</div>`;
  const intro = `<div class="muted small" style="margin-bottom:12px">${opts.intro}</div>`;
  const forms = {
    login: `<h1>登入${esc(opts.title)}</h1>${intro}<form class="form"><label class="f">電郵<input type="email" name="email" autocomplete="email" required></label>
      <label class="f">密碼<input type="password" name="pw" autocomplete="current-password" required></label>
      <div class="err" data-err></div><button class="btn block">登入</button></form>${links(['signup', '未有帳戶？註冊'], ['forgot', '忘記密碼'])}
      <p class="small muted" style="margin-top:14px">用家網站同後台用同一個帳戶。</p>`,
    signup: `<h1>註冊帳戶</h1>${intro}<form class="form"><label class="f">名稱（2 至 30 個字）<input name="username" maxlength="30" required></label>
      <label class="f">電郵<input type="email" name="email" autocomplete="email" required></label>
      <label class="f">密碼（最少 8 個字，要有英文字母同數字）<input type="password" name="pw" autocomplete="new-password" required></label>
      <label class="f">再輸入一次密碼<input type="password" name="pw2" autocomplete="new-password" required></label>
      ${PRIVACY}<label class="check"><input type="checkbox" name="consent"> 我已閱讀並同意私隱政策</label>
      <div class="err" data-err></div><button class="btn block">註冊</button></form>${links(['login', '已經有帳戶？登入'])}`,
    forgot: `<h1>忘記密碼</h1><form class="form"><label class="f">註冊用嘅電郵<input type="email" name="email" required></label>
      <div class="err" data-err></div><button class="btn block">寄重設連結</button></form>${links(['login', '返去登入'])}`,
    newpass: `<h1>設定新密碼</h1><form class="form"><label class="f">新密碼<input type="password" name="pw" autocomplete="new-password" required></label>
      <label class="f">再輸入一次<input type="password" name="pw2" autocomplete="new-password" required></label>
      <div class="err" data-err></div><button class="btn block">更新密碼</button></form>`
  };
  app.innerHTML = `<div class="card narrow">${forms[view]}</div>`;
  app.querySelectorAll('[data-v]').forEach(a => a.onclick = () => renderAuth(opts, a.dataset.v));
  const f = app.querySelector('form'), errBox = app.querySelector('[data-err]');
  f.onsubmit = e => { e.preventDefault(); busy(f.querySelector('button'), async () => {
    const d = formData(f);
    if (view === 'login') {
      const { error } = await P.sb.auth.signInWithPassword({ email: d.email.trim(), password: d.pw });
      if (error) { errBox.textContent = msgOf(error); return; }
      P.session = (await P.sb.auth.getSession()).data.session; renderWho(); opts.onReady();
    } else if (view === 'signup') {
      const email = d.email.trim();
      const bad = d.username.trim().length < 2 ? '名稱最少 2 個字' : pwProblem(d.pw, email) || (d.pw !== d.pw2 ? '兩次密碼唔一樣' : '') || (!d.consent ? '要同意私隱政策先可以註冊' : '');
      if (bad) { errBox.textContent = bad; return; }
      const { data, error } = await P.sb.auth.signUp({ email, password: d.pw, options: { emailRedirectTo: redirect,
        data: { username: d.username.trim(), pdpo_consent: true, pdpo_version: PS_PDPO_VERSION } } });
      if (error) { errBox.textContent = msgOf(error); return; }
      if (data.session) { P.session = data.session; renderWho(); opts.onReady(); return; }
      app.innerHTML = `<div class="card narrow status-card"><div class="big">📧</div><h2>差少少就完成</h2>
        <p>我哋寄咗確認電郵去 <b>${esc(email)}</b>，撳入面條連結就完成註冊。</p><p class="small muted">搵唔到？睇吓垃圾郵件。</p>
        <button class="btn ghost" data-v="login">去登入</button></div>`;
      app.querySelector('[data-v]').onclick = () => renderAuth(opts, 'login');
    } else if (view === 'forgot') {
      const { error } = await P.sb.auth.resetPasswordForEmail(d.email.trim(), { redirectTo: redirect });
      if (error && !/not found/i.test(error.message)) { errBox.textContent = msgOf(error); return; }
      app.innerHTML = '<div class="card narrow status-card"><div class="big">📧</div><p>如果有呢個帳戶，我哋已經寄咗重設密碼連結。</p></div>';
    } else if (view === 'newpass') {
      const bad = pwProblem(d.pw, P.session?.user?.email) || (d.pw !== d.pw2 ? '兩次密碼唔一樣' : '');
      if (bad) { errBox.textContent = bad; return; }
      const { error } = await P.sb.auth.updateUser({ password: d.pw });
      if (error) { errBox.textContent = msgOf(error); return; }
      toast('✅ 密碼已更新'); opts.onReady();
    }
  }); };
}

// 未同意私隱政策（例如喺數據庫建立之前註冊）
function renderConsent(after) {

// 營運商後台（+ 管理員審批）
// =====================================================================
const OP = { home: null, admin: null, tab: 'live', loc: null, days: 7, gateLog: [], timer: null, csvRows: null, csvName: '' };
const AUTH_OPTS = {
  title: '營運商後台', intro: '停車場營運商用：即時管理車位、閘口、遙距排隊、報表。管理員喺度審批營運商、商戶同停車場。',
  onReady: () => opLoad(), onSignedOut: () => { clearInterval(OP.timer); renderTabs([]); }
};

async function opLoad(keepTab) {
  const app = $('app');
  if (!OP.home) app.innerHTML = '<div class="loading">讀緊…</div>';
  try { OP.home = await rpc('ps_op_home'); } catch (e) { app.innerHTML = `<div class="card narrow err">${esc(e.message)}</div>`; return; }
  const h = OP.home, u = h.user, isAdmin = u.is_admin;
  if (!u.consent) { renderTabs([]); renderConsent(() => opLoad()); return; }
  const approved = h.providers.filter(p => p.status === 'approved');
  if (isAdmin) { try { OP.admin = await rpc('ps_admin_queue'); } catch (e) { OP.admin = null; } }
  if (!approved.length && !isAdmin) { renderTabs([]); renderApply(); return; }
  const tabs = [['live', '🚦 即時'], ['report', '📊 報表'], ['parks', '🅿️ 停車場']];
  if (isAdmin) tabs.push(['admin', '🛠️ 管理員']);
  if (!keepTab && location.hash === '#admin' && isAdmin) OP.tab = 'admin';
  if (!tabs.some(t => t[0] === OP.tab)) OP.tab = 'live';
  if (!h.locations.some(l => l.id === OP.loc)) OP.loc = h.locations[0]?.id ?? null;
  renderTabs(tabs);
  renderTab();
}

function renderTabs(tabs) {
  const el = $('tabs');
  const pending = OP.admin ? OP.admin.providers.filter(p => p.status === 'pending').length + OP.admin.merchants.filter(m => m.status === 'pending').length
    + OP.admin.uploads.filter(c => c.status === 'pending').length : 0;
  el.innerHTML = tabs.map(([k, t]) => `<button data-t="${k}" class="${k === OP.tab ? 'on' : ''}">${t}${k === 'admin' && pending ? `<span class="badge">${pending}</span>` : ''}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { OP.tab = b.dataset.t; history.replaceState(null, '', OP.tab === 'admin' ? '#admin' : location.pathname); renderTabs(tabs); renderTab(); });
}

function renderTab() {
  clearInterval(OP.timer);
  ({ live: renderLive, report: renderReport, parks: renderParks, admin: renderAdmin })[OP.tab]();
}

  const app = $('app'), h = OP.home;
  const pend = h.providers.find(p => p.status === 'pending');

      <p><b>${esc(pend.company_name)}</b><br><span class="muted small">${dt(pend.created_at)} 提交</span></p>

  }

  app.innerHTML = applyFormHtml('申請成為停車場營運商', '你嘅停車場加入 ParkSmart 之後，司機可以預約車位；滿咗可以遙距排隊，唔使喺街上等。',
    [['company', '公司／停車場營運者名稱', 'text', true, '例如：好停車有限公司'], ['person', '聯絡人', 'text', false, ''],
     ['phone', '聯絡電話', 'tel', false, '2345 6789'], ['email', '聯絡電郵', 'email', false, '']],
    rej ? `上次申請被拒絕${rej.review_note ? '：' + esc(rej.review_note) : ''}。可以修改後再申請。` : '');
  const f = app.querySelector('form');

    const d = formData(f);
    try { await rpc('ps_op_apply', { p_company: d.company, p_contact_person: d.person, p_contact_phone: d.phone, p_contact_email: d.email }); toast('✅ 已提交申請'); opLoad(); }

function locSelect() {
  const ls = OP.home.locations;
  if (!ls.length) return '';
  return `<select class="inp" data-loc style="max-width:360px">${ls.map(l => `<option value="${l.id}" ${l.id === OP.loc ? 'selected' : ''}>${esc(l.name)}${l.is_active ? '' : '（停用中）'}${OP.home.user.is_admin ? '．' + esc(l.provider) : ''}</option>`).join('')}</select>`;
}
function bindLocSelect(root, rerender) {
  const s = root.querySelector('[data-loc]');
  if (s) s.onchange = () => { OP.loc = +s.value; rerender(); };
}
const noLoc = () => `<div class="card status-card"><div class="big">🅿️</div><h2>未有停車場</h2><p class="muted">去「🅿️ 停車場」分頁新增，或者上載 CSV。管理員批准之後就會出現。</p></div>`;

// ---------- 即時 ----------
async function renderLive() {

  if (!OP.loc) { app.innerHTML = noLoc(); return; }
  let q;
  try { q = await rpc('ps_op_queue', { p_location: OP.loc }); } catch (e) { app.innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  if (OP.tab !== 'live') return;
  const L = q.location;
  const kpis = (label, s) => `
    <div class="kpi ${s.free > 0 ? 'ok' : 'bad'}"><div class="k">${label}空位</div><div class="v">${s.available}<small> ／ ${s.total}</small></div></div>
    <div class="kpi"><div class="k">${label}已答應（未到）</div><div class="v">${s.held}</div></div>
    <div class="kpi ${s.free > 0 ? 'ok' : ''}"><div class="k">${label}可預約</div><div class="v">${s.free}</div></div>
    <div class="kpi ${s.queue ? 'warn' : ''}"><div class="k">${label}排隊中</div><div class="v">${s.queue}<small> 人</small></div></div>`;

    <div class="card-head"><div class="btns" style="align-items:center">${locSelect()}<span class="muted small">每 15 秒自動更新．${hhmm(Date.now())}</span></div>
      <button class="btn ghost sm" data-refresh>⟳ 更新</button></div>
    <div class="card"><div class="kpis four">${kpis('一般', L.regular)}${L.ev ? kpis('⚡ 充電', L.ev) : ''}</div>
      <p class="small muted" style="margin:10px 0 0">平均每 ${num(L.regular.turnover_min)} 分鐘走一架車（最近 20 次出閘計）．$${num(L.hourly_rate)}／小時．寬限 ${L.grace_min} 分鐘</p></div>
    <div class="grid2">
      <div class="card"><h2>🚗 閘口（車牌辨識模擬）</h2>
        <form class="form" data-gate><div class="row"><label class="f">車牌<input name="plate" class="inp" placeholder="例如 AB1234" maxlength="10" autocomplete="off" required></label>
          <label class="f">冇預約嘅車泊<select name="t"><option value="">一般車位</option>${L.ev ? '<option value="ev">充電車位</option>' : ''}</select></label></div>
          <div class="btns"><button class="btn" data-k="entry">⬇️ 入閘</button><button class="btn warn" data-k="exit">⬆️ 出閘</button></div></form>
        <div class="small" style="margin-top:10px">${OP.gateLog.map(x => `<div>${x}</div>`).join('') || '<span class="muted">真正落地時，閘口鏡頭讀到車牌就會自動叫呢個功能。</span>'}</div></div>
      <div class="card"><h2>✏️ 手動設定空位</h2><p class="small muted" style="margin-top:0">感應器／人手點數同系統唔同時用。增加空位會自動叫下一個排隊嘅人。</p>
        <form class="form" data-spots><div class="row"><label class="f">一般空位（0 至 ${L.regular.total}）<input type="number" name="a" min="0" max="${L.regular.total}" value="${L.regular.available}"></label>
          ${L.ev ? `<label class="f">充電空位（0 至 ${L.ev.total}）<input type="number" name="e" min="0" max="${L.ev.total}" value="${L.ev.available}"></label>` : ''}</div>
          <div><button class="btn ghost">更新空位</button></div></form></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>🎫 遙距排隊（${q.tickets.length}）</h2><div class="tbl-wrap"><table><thead><tr><th>籌號</th><th>車牌</th><th>種類</th><th>狀態</th></tr></thead><tbody>

          <td>${t.status === 'called' ? `${pill('called')} ${hhmm(t.respond_by)} 前到` : `${pill('waiting')} 第 ${t.position} 位`}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">冇人排隊</td></tr>'}
      </tbody></table></div></div>
      <div class="card"><h2>📅 預約／泊緊（${q.bookings.length}）</h2><div class="tbl-wrap"><table><thead><tr><th>車牌</th><th>種類</th><th>來源</th><th>狀態</th></tr></thead><tbody>

  OP.timer = setInterval(() => {

    if (OP.tab === 'live' && !document.hidden && !(a && /INPUT|SELECT/.test(a.tagName))) renderLive();
  }, 15000);
}

// ---------- 報表 ----------
async function renderReport() {
  const app = $('app');
  if (!OP.loc) { app.innerHTML = noLoc(); return; }
  app.innerHTML = '<div class="loading">讀緊…</div>';
  let r;
  try { r = await rpc('ps_op_stats', { p_location: OP.loc, p_days: OP.days }); } catch (e) { app.innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  const days = r.days.slice().reverse();
  const sum = k => r.days.reduce((a, d) => a + (+d[k] || 0), 0);
  const avg = k => { const xs = r.days.filter(d => d[k] !== null && d[k] !== undefined).map(d => +d[k]); return xs.length ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length) : null; };
  const cols = [['day', '日期'], ['bookings', '預約'], ['queue', '排隊'], ['completed', '完成'], ['no_show', '失約'], ['cancelled', '取消'],
    ['revenue', '泊車收入'], ['no_show_fees', '失約費'], ['discounts', '優惠折扣'], ['avg_stay_min', '平均泊（分鐘）'], ['avg_wait_min', '平均等（分鐘）'], ['entries', '入閘'], ['exits', '出閘']];
  const isMoney = k => ['revenue', 'no_show_fees', 'discounts'].includes(k);
  const total = sum('bookings') + sum('queue');
  app.innerHTML = `
    <div class="card-head"><div class="btns" style="align-items:center">${locSelect()}
      <select class="inp" data-days style="width:auto">${[7, 14, 30].map(n => `<option value="${n}" ${n === OP.days ? 'selected' : ''}>最近 ${n} 日</option>`).join('')}</select></div>
      <button class="btn ghost sm" data-csv>⬇️ 下載 CSV</button></div>
    <div class="card"><div class="kpis">
      <div class="kpi"><div class="k">預約</div><div class="v">${sum('bookings')}</div></div>
      <div class="kpi"><div class="k">遙距排隊</div><div class="v">${sum('queue')}</div></div>
      <div class="kpi ok"><div class="k">完成泊車</div><div class="v">${sum('completed')}</div></div>
      <div class="kpi ${sum('no_show') ? 'bad' : ''}"><div class="k">失約率</div><div class="v">${total ? Math.round(sum('no_show') / total * 100) : 0}<small>%</small></div></div>
      <div class="kpi ok"><div class="k">泊車收入</div><div class="v">${money(sum('revenue'))}</div></div>
      <div class="kpi"><div class="k">失約費</div><div class="v">${money(sum('no_show_fees'))}</div></div>
      <div class="kpi"><div class="k">平均排隊等候</div><div class="v">${avg('avg_wait_min') ?? '—'}<small> 分鐘</small></div></div>
      <div class="kpi"><div class="k">平均泊車時間</div><div class="v">${avg('avg_stay_min') ?? '—'}<small> 分鐘</small></div></div>
    </div><p class="small muted" style="margin:10px 0 0">「平均排隊等候」= 攞籌到叫號嘅時間：司機呢段時間唔使喺街上等，可以用嚟評估減少路面排隊嘅效果。</p></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr>${cols.map(([k, t]) => `<th class="${k === 'day' ? '' : 'num'}">${t}</th>`).join('')}</tr></thead><tbody>
      ${days.map(d => `<tr>${cols.map(([k]) => `<td class="${k === 'day' ? '' : 'num'}">${k === 'day' ? esc(d.day) : d[k] === null ? '—' : isMoney(k) ? money(d[k]) : esc(d[k])}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;
  bindLocSelect(app, renderReport);
  app.querySelector('[data-days]').onchange = e => { OP.days = +e.target.value; renderReport(); };
  app.querySelector('[data-csv]').onclick = () => {
    const lines = [cols.map(c => c[1]).join(',')].concat(r.days.map(d => cols.map(([k]) => csvCell(d[k] ?? '')).join(',')));
    download(`parksmart-report-${OP.loc}-${r.days[r.days.length - 1].day}.csv`, lines.join('\n'));
  };
}

// ---------- 停車場：設定 + 新增 + CSV ----------
const CSV_COLS = ['name', 'address', 'district', 'latitude', 'longitude', 'total_spots', 'ev_spots', 'hourly_rate', 'ext_park_id'];
const CSV_LABEL = { name: '名稱', address: '地址', district: '地區', latitude: '緯度', longitude: '經度', total_spots: '一般車位', ev_spots: '充電車位', hourly_rate: '每小時 $', ext_park_id: '運輸署編號' };
function renderParks() {
  const app = $('app'), h = OP.home;
  const L = h.locations.find(l => l.id === OP.loc);
  const provs = h.providers.filter(p => p.status === 'approved' && p.is_active);
  app.innerHTML = `
    ${L ? `<div class="card"><div class="card-head"><h2>✏️ 停車場資料</h2>${locSelect()}</div>
      <form class="form" data-edit>
        <div class="row"><label class="f">名稱<input name="name" value="${esc(L.name)}" maxlength="120" required></label>
          <label class="f">地區<input name="district" value="${esc(L.district || '')}" maxlength="40"></label></div>
        <label class="f">地址<input name="address" value="${esc(L.address || '')}" maxlength="200"></label>
        <div class="row"><label class="f">一般車位總數<input type="number" name="total" min="0" max="10000" value="${L.regular.total}" required></label>
          <label class="f">充電車位總數<input type="number" name="ev" min="0" max="2000" value="${L.ev ? L.ev.total : 0}" required></label>
          <label class="f">每小時收費（$）<input type="number" name="rate" min="0" max="1000" step="0.5" value="${num(L.hourly_rate)}" required></label>
          <label class="f">寬限（分鐘，5 至 60）<input type="number" name="grace" min="5" max="60" value="${L.grace_min}" required></label></div>
        <label class="f">收費說明（顯示畀司機睇）<input name="pricing" value="${esc(L.pricing_info || '')}" maxlength="200" placeholder="例如：平日 $25／小時，夜泊 $120"></label>
        <label class="check"><input type="checkbox" name="active" ${L.is_active ? 'checked' : ''}> 接受預約（取消剔 = 暫停，司機睇唔到）</label>
        <div class="err" data-err></div><div><button class="btn">儲存</button></div></form></div>` : ''}
    ${provs.length ? `<div class="grid2">
      <div class="card"><h2>➕ 新增一個停車場</h2>
        <form class="form" data-add>${provs.length > 1 ? `<label class="f">公司<select name="prov">${provs.map(p => `<option value="${p.id}">${esc(p.company_name)}</option>`).join('')}</select></label>` : ''}
          <label class="f">名稱<input name="name" required maxlength="120"></label>
          <label class="f">地址<input name="address" maxlength="200"></label>
          <div class="row"><label class="f">地區<input name="district" maxlength="40"></label><label class="f">運輸署編號（可以唔填）<input name="ext_park_id" maxlength="40" placeholder="例如 tdc12p3"></label></div>
          <div class="row"><label class="f">緯度<input name="latitude" required placeholder="22.3193"></label><label class="f">經度<input name="longitude" required placeholder="114.1694"></label></div>
          <p class="hint" style="margin:-4px 0 0">喺 Google Maps 撳住個位置，就會見到「22.31…, 114.16…」，前面係緯度，後面係經度。</p>
          <div class="row"><label class="f">一般車位<input type="number" name="total_spots" min="0" required></label><label class="f">充電車位<input type="number" name="ev_spots" min="0" value="0"></label>
            <label class="f">每小時 $<input type="number" name="hourly_rate" min="0" step="0.5" required></label></div>
          <div class="err" data-err></div><div><button class="btn">提交審批</button></div></form></div>
      <div class="card"><h2>📄 CSV 一次過上載</h2>
        <p class="small muted" style="margin-top:0">適合有好多個停車場嘅營運商。最多 200 行。系統會逐行檢查，有錯會講你知邊行邊格。</p>
        <div class="btns"><button class="btn ghost sm" data-tpl>⬇️ 下載 CSV 範本</button><label class="btn ghost sm" style="cursor:pointer">📂 揀 CSV 檔<input type="file" accept=".csv,text/csv" data-file hidden></label></div>
        ${provs.length > 1 ? `<label class="f" style="margin-top:10px">公司<select data-csvprov>${provs.map(p => `<option value="${p.id}">${esc(p.company_name)}</option>`).join('')}</select></label>` : ''}
        <div data-preview style="margin-top:12px"></div></div></div>` : ''}
    <div class="card"><h2>📬 我嘅提交記錄</h2><div class="tbl-wrap"><table><thead><tr><th>日期</th><th>檔案</th><th class="num">行數</th><th>狀態</th><th>備註</th></tr></thead><tbody>
      ${h.uploads.map(c => `<tr><td>${dt(c.created_at)}</td><td>${esc(c.file_name)}</td><td class="num">${c.row_count}</td><td>${pill(c.status)}</td><td class="small">${esc(c.notes || '')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">未有</td></tr>'}
    </tbody></table></div></div>`;
  bindLocSelect(app, renderParks);
  const ef = app.querySelector('[data-edit]');
  if (ef) ef.onsubmit = e => { e.preventDefault(); busy(ef.querySelector('button'), async () => {
    const d = formData(ef);
    try {
      await rpc('ps_op_update_location', { p_location: OP.loc, p_name: d.name, p_address: d.address, p_district: d.district, p_total: +d.total, p_ev: +d.ev,
        p_rate: +d.rate, p_grace: +d.grace, p_pricing_info: d.pricing, p_active: !!d.active });
      toast('✅ 已儲存'); await opLoad(true);
    } catch (err) { ef.querySelector('[data-err]').textContent = err.message; }
  }); };
  const submitRows = async (prov, name, rows, errBox) => {
    const r = await rpc('ps_op_submit_locations', { p_provider: prov, p_file_name: name, p_rows: rows });
    if (!r.ok) {
      errBox.innerHTML = '有資料唔啱，未提交：<br>' + r.errors.map(x => `第 ${x.row} 行：${x.errors.map(esc).join('、')}`).join('<br>');
      return false;
    }
    toast(`✅ 已提交 ${r.rows} 個停車場，等管理員審批`, 4000);
    await opLoad(true);
    return true;
  };
  const af = app.querySelector('[data-add]');
  if (af) af.onsubmit = e => { e.preventDefault(); busy(af.querySelector('button'), async () => {
    const d = formData(af), errBox = af.querySelector('[data-err]');
    errBox.textContent = '';
    const row = Object.fromEntries(CSV_COLS.map(k => [k, (d[k] ?? '').trim()]));
    try { await submitRows(+(d.prov || provs[0].id), '手動輸入：' + row.name, [row], errBox); } catch (err) { errBox.textContent = err.message; }
  }); };
  const tpl = app.querySelector('[data-tpl]');
  if (tpl) tpl.onclick = () => download('parksmart-carparks-template.csv', CSV_COLS.join(',') + '\n' +
    ['好停車旺角,旺角道 1 號,油尖旺,22.3193,114.1694,120,6,28,', '好停車觀塘,觀塘道 2 號,觀塘,22.3120,114.2250,80,0,22,'].join('\n'));
  const fi = app.querySelector('[data-file]');
  if (fi) fi.onchange = async () => {
    const f = fi.files[0]; if (!f) return;
    if (f.size > 500 * 1024) { toast('⚠️ 檔案太大（最大 500 KB）', 4000); return; }
    OP.csvRows = parseCsv(await f.text()); OP.csvName = f.name;
    const box = app.querySelector('[data-preview]');
    const missing = ['name', 'latitude', 'longitude', 'total_spots', 'hourly_rate'].filter(k => OP.csvRows.length && !(k in OP.csvRows[0]));
    if (!OP.csvRows.length || missing.length) { box.innerHTML = `<div class="err">讀唔到資料${missing.length ? '：缺少欄位 ' + missing.join('、') : ''}。請用範本嘅標題。</div>`; return; }
    box.innerHTML = `<p class="small"><b>${esc(f.name)}</b>：${OP.csvRows.length} 行${OP.csvRows.length > 200 ? '（多過 200 行，請分開上載）' : ''}</p>
      <div class="tbl-wrap"><table><thead><tr><th>#</th>${CSV_COLS.map(k => `<th>${CSV_LABEL[k]}</th>`).join('')}</tr></thead><tbody>
      ${OP.csvRows.slice(0, 20).map((r, i) => `<tr><td>${i + 1}</td>${CSV_COLS.map(k => `<td class="small">${esc(r[k] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${OP.csvRows.length > 20 ? `<p class="small muted">（只顯示頭 20 行）</p>` : ''}
      <div class="err" data-err style="margin-top:8px"></div><button class="btn" data-send style="margin-top:10px">提交審批</button>`;
    box.querySelector('[data-send]').onclick = e => busy(e.currentTarget, async () => {
      const errBox = box.querySelector('[data-err]'); errBox.textContent = '';
      const prov = +(app.querySelector('[data-csvprov]')?.value || provs[0].id);
      try { await submitRows(prov, OP.csvName, OP.csvRows.map(r => Object.fromEntries(CSV_COLS.map(k => [k, r[k] ?? '']))), errBox); }
      catch (err) { errBox.textContent = err.message; }
    });
  };
}

// ---------- 管理員 ----------
async function renderAdmin() {
  const app = $('app');
  app.innerHTML = '<div class="loading">讀緊…</div>';
  try { OP.admin = await rpc('ps_admin_queue'); } catch (e) { app.innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  const a = OP.admin, c = a.counts;
  const pp = a.providers.filter(p => p.status === 'pending'), pm = a.merchants.filter(m => m.status === 'pending'), pu = a.uploads.filter(u => u.status === 'pending');
  const reviewBtns = (kind, id) => `<div class="btns"><input class="inp" style="max-width:180px;padding:5px 8px;font-size:13px" placeholder="備註（可以唔填）" data-note="${kind}${id}">
    <button class="btn ok sm" data-rv="${kind}" data-id="${id}" data-ok="1">批准</button><button class="btn bad sm" data-rv="${kind}" data-id="${id}" data-ok="0">拒絕</button></div>`;
  app.innerHTML = `
    <div class="card"><div class="kpis">
      <div class="kpi"><div class="k">用戶</div><div class="v">${c.users}</div></div>
      <div class="kpi"><div class="k">今日預約</div><div class="v">${c.bookings_today}</div></div>
      <div class="kpi"><div class="k">今日排隊</div><div class="v">${c.queue_today}</div></div>
      <div class="kpi"><div class="k">生效優惠券</div><div class="v">${c.active_coupons}</div></div>
      <div class="kpi ${pp.length + pm.length + pu.length ? 'warn' : 'ok'}"><div class="k">等你審批</div><div class="v">${pp.length + pm.length + pu.length}</div></div></div></div>
    <div class="card"><h2>🏢 營運商申請（${pp.length} 個等審批）</h2><div class="tbl-wrap"><table><thead><tr><th>公司</th><th>聯絡</th><th>申請人</th><th>日期</th><th>狀態</th><th></th></tr></thead><tbody>
      ${a.providers.map(p => `<tr><td><b>${esc(p.company_name)}</b><div class="small muted">${p.locations} 個停車場</div></td>
        <td class="small">${esc(p.contact_person || '')}<br>${esc(p.contact_phone || '')} ${esc(p.contact_email || '')}</td><td class="small">${esc(p.applicant || '—')}</td>
        <td class="small">${dmy(p.created_at)}</td><td>${pill(p.status)}${p.is_active ? '' : ' <span class="pill bad">停用</span>'}<div class="small muted">${esc(p.review_note || '')}</div></td>
        <td>${p.status === 'pending' ? reviewBtns('p', p.id) : p.status === 'approved' ? `<button class="btn ghost sm" data-pact="${p.id}" data-on="${p.is_active ? 0 : 1}">${p.is_active ? '停用' : '恢復'}</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">冇</td></tr>'}
    </tbody></table></div></div>
    <div class="card"><h2>🏪 商戶申請（${pm.length} 個等審批）</h2><div class="tbl-wrap"><table><thead><tr><th>店名</th><th>地區</th><th>聯絡</th><th>申請人</th><th>日期</th><th>狀態</th><th></th></tr></thead><tbody>
      ${a.merchants.map(m => `<tr><td><b>${esc(m.name)}</b><div class="small muted">${m.coupons} 張優惠券</div></td><td>${esc(m.district || '')}</td>
        <td class="small">${esc(m.contact_phone || '')} ${esc(m.contact_email || '')}</td><td class="small">${esc(m.applicant || '—')}</td><td class="small">${dmy(m.created_at)}</td>
        <td>${pill(m.status)}<div class="small muted">${esc(m.review_note || '')}</div></td>
        <td>${m.status === 'pending' ? reviewBtns('m', m.id) : m.status === 'approved' ? `<button class="btn ghost sm" data-rv="m" data-id="${m.id}" data-ok="0">取消資格</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">冇</td></tr>'}
    </tbody></table></div></div>
    <div class="card"><h2>📄 新停車場（${pu.length} 個等審批）</h2>
      ${a.uploads.map(u => `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px">
        <div class="card-head" style="margin:0"><div><b>${esc(u.provider)}</b>：${esc(u.file_name)}．${u.row_count} 個停車場 ${pill(u.status)}
          <div class="small muted">${dt(u.created_at)}．${esc(u.uploader || '')}${u.notes ? '．' + esc(u.notes) : ''}</div></div>${u.status === 'pending' ? reviewBtns('u', u.id) : ''}</div>
        <details style="margin-top:6px"><summary class="small">睇內容</summary><div class="tbl-wrap" style="margin-top:6px"><table><thead><tr>${CSV_COLS.map(k => `<th>${CSV_LABEL[k]}</th>`).join('')}</tr></thead><tbody>
          ${u.rows.map(r => `<tr>${CSV_COLS.map(k => `<td class="small">${esc(r[k] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details></div>`).join('') || '<p class="empty">冇</p>'}</div>
    <div class="card"><h2>🅿️ 全部停車場（${a.locations.length}）</h2><div class="tbl-wrap"><table><thead><tr><th>名稱</th><th>營運商</th><th class="num">一般</th><th class="num">充電</th><th class="num">$／小時</th><th>狀態</th><th></th></tr></thead><tbody>
      ${a.locations.map(l => `<tr><td>${esc(l.name)}<div class="small muted">${esc(l.district || '')}${l.ext_park_id ? '．運輸署 ' + esc(l.ext_park_id) : ''}</div></td><td class="small">${esc(l.provider)}</td>
        <td class="num">${l.regular.available}/${l.regular.total}</td><td class="num">${l.ev ? l.ev.available + '/' + l.ev.total : '—'}</td><td class="num">${num(l.hourly_rate)}</td>
        <td>${l.is_active ? '<span class="pill ok">接受預約</span>' : '<span class="pill">暫停</span>'}</td>
        <td><button class="btn ghost sm" data-lact="${l.id}" data-on="${l.is_active ? 0 : 1}">${l.is_active ? '暫停' : '恢復'}</button></td></tr>`).join('') || '<tr><td colspan="7" class="empty">冇</td></tr>'}
    </tbody></table></div><p class="small muted">提示：喺用家網站地圖撳運輸署停車場，都可以「＋ 加入試點」。</p></div>
    <div class="grid2">
      <div class="card"><h2>👤 設定用戶角色</h2><form class="form" data-role><label class="f">用戶電郵<input type="email" name="email" required></label>
        <label class="f">角色<select name="role"><option value="driver">普通用戶</option><option value="operator">營運商</option><option value="merchant">商戶</option><option value="admin">管理員</option></select></label>
        <label class="f">（營運商）加入邊個停車場嘅公司<select name="loc"><option value="">唔使</option>${a.locations.map(l => `<option value="${l.id}">${esc(l.name)}．${esc(l.provider)}</option>`).join('')}</select></label>
        <div class="err" data-err></div><div class="okmsg" data-ok></div><div><button class="btn ghost">設定</button></div></form></div>
      <div class="card"><h2>🧾 審計記錄（最近 40）</h2><div class="tbl-wrap" style="max-height:340px;overflow-y:auto"><table><thead><tr><th>時間</th><th>動作</th><th>邊個</th></tr></thead><tbody>
        ${a.audit.map(x => `<tr><td class="small">${dt(x.at)}</td><td class="small">${esc(x.action)}${x.entity ? `<span class="muted">．${esc(x.entity)} ${esc(x.entity_id || '')}</span>` : ''}</td><td class="small">${esc(x.actor || '系統')}</td></tr>`).join('')}
      </tbody></table></div></div></div>`;
  app.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => busy(b, async () => {
    const fn = { p: 'ps_admin_review_provider', m: 'ps_admin_review_merchant', u: 'ps_admin_review_upload' }[b.dataset.rv];
    const note = app.querySelector(`[data-note="${b.dataset.rv}${b.dataset.id}"]`)?.value || null;
    try { const r = await rpc(fn, { p_id: +b.dataset.id, p_approve: b.dataset.ok === '1', p_note: note });
      toast(b.dataset.ok === '1' ? `✅ 已批准${r.created ? `，建立咗 ${r.created} 個停車場` : ''}` : '已處理');
      await opLoad(true); } catch (err) { toast('⚠️ ' + err.message, 5000); }
  }));
  app.querySelectorAll('[data-pact]').forEach(b => b.onclick = () => busy(b, async () => {
    try { await rpc('ps_admin_set_provider_active', { p_id: +b.dataset.pact, p_active: b.dataset.on === '1' }); await opLoad(true); } catch (err) { toast('⚠️ ' + err.message, 4000); }
  }));
  app.querySelectorAll('[data-lact]').forEach(b => b.onclick = () => busy(b, async () => {
    try { await rpc('ps_admin_set_active', { p_location: +b.dataset.lact, p_active: b.dataset.on === '1' }); await opLoad(true); } catch (err) { toast('⚠️ ' + err.message, 4000); }
  }));
  const rf = app.querySelector('[data-role]');
  rf.onsubmit = e => { e.preventDefault(); busy(rf.querySelector('button'), async () => {
    const d = formData(rf);
    rf.querySelector('[data-err]').textContent = ''; rf.querySelector('[data-ok]').textContent = '';
    try { await rpc('ps_admin_set_role', { p_email: d.email, p_role: d.role, p_location: d.loc ? +d.loc : null }); rf.querySelector('[data-ok]').textContent = '✅ 已設定'; }
    catch (err) { rf.querySelector('[data-err]').textContent = err.message; }
  }); };
}

portalStart(AUTH_OPTS);

</script>
</body>
</html>
