<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-HeEe9w22QffXAe7MhiRCXoYP3c5GhQgg1/HXQVj0hTY=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>ParkSmart 停車場管理系統</title>
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --ink: #1c2430; --muted: #66707d; --line: #e3e7ed; --soft: #f0f3f7;
  --accent: #0b63c5; --accent-ink: #ffffff; --accent-soft: #e6f0fb;
  --ok: #1e8e3e; --ok-soft: #e6f4ea; --warn: #b26a00; --warn-soft: #fff4e0; --bad: #c62828; --bad-soft: #fdecea;
  --radius: 12px; --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Segoe UI", "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }

/* 頂部 */
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 16px; }
.brand small { font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; font-size: 12px; }
.top .sp { flex: 1; }
.who { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
.tabs { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
.tabs button { background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .badge { background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; margin-left: 4px; }

main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { font-size: 22px; margin: 4px 0 14px; }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head h2 { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.narrow { max-width: 460px; margin: 30px auto; }

/* 數字格 */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 640px) { .kpis.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi.ok { background: var(--ok-soft); } .kpi.warn { background: var(--warn-soft); } .kpi.bad { background: var(--bad-soft); }

/* 表格 */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: var(--soft); font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 14px; text-align: center; }

/* 標籤 */
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.ok, .pill.approved, .pill.checked_in { background: var(--ok-soft); color: var(--ok); }
.pill.warn, .pill.pending, .pill.called, .pill.reserved, .pill.waiting { background: var(--warn-soft); color: var(--warn); }
.pill.bad, .pill.rejected { background: var(--bad-soft); color: var(--bad); }

/* 表單 */
.form { display: grid; gap: 12px; }
.form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.f input, label.f select, label.f textarea, .inp { width: 100%; border: 1px solid #cfd6df; border-radius: 8px; padding: 9px 11px; background: #fff; color: var(--ink); font-size: 15px; }
label.f input:focus, label.f select:focus, .inp:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.check input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--accent); flex-shrink: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 8px; padding: 9px 16px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.55; cursor: default; filter: none; }
.btn.ghost { background: #fff; color: var(--ink); border-color: #cfd6df; }
.btn.ok { background: var(--ok); } .btn.bad { background: var(--bad); } .btn.warn { background: #e37400; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: var(--bad); font-size: 14px; }
.err:empty { display: none; }
.okmsg { color: var(--ok); font-size: 14px; }
.okmsg:empty { display: none; }
.links { display: flex; justify-content: space-between; font-size: 14px; margin-top: 12px; }
.links a { cursor: pointer; }
details.box { background: var(--soft); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
details.box summary { cursor: pointer; color: var(--ink); }
details.box p { margin: 6px 0; }

/* 提示訊息 */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: 0.2s; background: #1c2430; color: #fff;
  padding: 10px 16px; border-radius: 10px; z-index: 100; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); pointer-events: none; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
.status-card { text-align: center; padding: 28px 16px; }
.status-card .big { font-size: 40px; }
@media (max-width: 560px) { .top-in { gap: 8px; } .brand small { display: none; } .who { display: none; } .tabs { overflow-x: auto; white-space: nowrap; } }

/* ===== 停車場管理系統：深色控制室 ===== */
:root {
  --bg: #0b1016; --card: #121a23; --ink: #e6edf5; --muted: #8b9bb0; --line: #243243; --soft: #182330;
  --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: rgba(57, 135, 229, 0.16);
  --ok: #0ca30c; --ok-soft: rgba(12, 163, 12, 0.16); --warn: #fab219; --warn-soft: rgba(250, 178, 25, 0.14);
  --bad: #d03b3b; --bad-soft: rgba(208, 59, 59, 0.16); --serious: #ec835a;
  --s1: #3987e5; --s2: #d95926; --grid: #1f2b38; --axis: #33465c;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
body { background: radial-gradient(1200px 600px at 70% -10%, #13202e 0%, var(--bg) 60%) fixed; }
.top { background: rgba(11, 16, 22, 0.92); backdrop-filter: blur(6px); }
.top-in, .tabs, main { max-width: 1680px; }
.btn.ghost { background: var(--soft); color: var(--ink); border-color: var(--line); }
label.f input, label.f select, label.f textarea, .inp { background: #0e151d; color: var(--ink); border-color: #2a394b; }
th { background: #151f2a; }
.pill { background: #1c2836; }
details.box { background: var(--soft); }
#toast { background: #e6edf5; color: #0b1016; }

/* 狀態列 */
.cbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.live-dot::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.6); animation: blink 1.6s infinite; }
.live-dot.off::before { background: #5b6b7f; animation: none; }
@keyframes blink { 0% { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.55); } 100% { box-shadow: 0 0 0 8px rgba(12, 163, 12, 0); } }
.cbar .sp { flex: 1; }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: none; color: var(--muted); padding: 6px 10px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--accent-soft); color: var(--ink); }

/* 數字格 */
.kstrip { display: grid; grid-template-columns: 1.3fr repeat(4, 1fr) repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
@media (max-width: 1280px) { .kstrip { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 720px) { .kstrip { grid-template-columns: repeat(2, 1fr); } }
.kt { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.kt .k { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kt .v { font-size: 24px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.kt .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.kt.hero .v { font-size: 34px; }
.meter { height: 6px; border-radius: 3px; background: rgba(57, 135, 229, 0.18); margin-top: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.6s; }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }

/* 版面 */
.cgrid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 14px; }
.cgrid2b { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 14px; margin-top: 14px; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.col .grow { flex: 1; }
@media (max-width: 1180px) { .cgrid, .cgrid2b { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; min-width: 0; }
.ph { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; }
.ph h2 { font-size: 14px; margin: 0; display: flex; align-items: center; gap: 8px; }
.ph h2::before { content: ''; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }
.ph .small { color: var(--muted); }

/* 平面圖 */
.fp-wrap { position: relative; background: #0d141c; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fp-wrap svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 2px solid; }
.lvtabs { display: inline-flex; gap: 4px; }
.lvtabs button { background: var(--soft); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.lvtabs button.on { color: var(--ink); border-color: var(--accent); }
.bay { cursor: pointer; }
.bay rect.b { stroke-width: 2; rx: 4; transition: fill 0.4s, stroke 0.4s; }
.bay.free rect.b { fill: rgba(12, 163, 12, 0.14); stroke: #0ca30c; }
.bay.reserved rect.b { fill: rgba(250, 178, 25, 0.18); stroke: #fab219; }
.bay.occupied rect.b { fill: rgba(208, 59, 59, 0.30); stroke: #d03b3b; }
.bay.disabled rect.b { fill: url(#hatch); stroke: #5b6b7f; }
.bay:hover rect.b, .bay.sel rect.b { stroke-width: 3.5; filter: brightness(1.25); }
.bay text { fill: #ffffff; pointer-events: none; font-family: inherit; }
.bay .code { font-weight: 700; }
.bay .sub { fill: #d6e0ea; }
.bay.flash rect.b { animation: flash 1.2s ease-out 2; }
@keyframes flash { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }
.fp-tip { position: absolute; pointer-events: none; background: #e6edf5; color: #0b1016; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); max-width: 240px; z-index: 5; display: none; }
.fp-tip b { font-size: 14px; }
.bay-detail { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--soft); display: none; }
.bay-detail.on { display: block; }

/* 鏡頭牆 */
.camwall { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cam { position: relative; background: #070b10; border: 1px solid #1d2a38; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 10; }
.cam canvas { width: 100%; height: 100%; display: block; }
.cam .cl { position: absolute; left: 8px; top: 6px; right: 70px; font-size: 11px; color: #cfe0f2; text-shadow: 0 1px 2px #000; display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
.cam .cl b { background: rgba(0, 0, 0, 0.55); padding: 1px 6px; border-radius: 4px; }
.cam .cl .rec { color: #ff6b6b; animation: rec 1.6s steps(2) infinite; }
@keyframes rec { 50% { opacity: 0.25; } }
@media (max-width: 720px) { .camwall { grid-template-columns: 1fr; } .ocr { grid-template-columns: 1fr 1fr; } }
.cam .cr { position: absolute; right: 8px; top: 6px; font-size: 11px; color: #9fb3c8; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.cam.off::after { content: '鏡頭停用'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: rgba(0, 0, 0, 0.6); }
.ocr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.ocr figure { margin: 0; background: #0d141c; border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: center; }
.ocr figcaption { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.ocr canvas { width: 100%; height: auto; display: block; border-radius: 4px; }
.ocr-res { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.ocr-res b { color: var(--ink); font-size: 14px; }

/* 紀錄 */
.tbl-wrap.dark { border-color: var(--line); max-height: 330px; overflow-y: auto; }
.tbl-wrap.dark table { font-size: 13px; }
.tbl-wrap.dark td, .tbl-wrap.dark th { border-color: #1c2735; padding: 6px 8px; }
.tbl-wrap.dark tr.new td { animation: rowin 1.6s ease-out; }
@keyframes rowin { 0% { background: rgba(57, 135, 229, 0.28); } 100% { background: transparent; } }
.r-ok { color: #4cc94c; } .r-warn { color: var(--warn); } .r-bad { color: #ff7b7b; } .r-mute { color: var(--muted); }
.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
.syslog { background: #070b10; border: 1px solid #1d2a38; border-radius: 8px; padding: 8px 10px; height: 150px; overflow-y: auto; font-size: 12px; line-height: 1.6; color: #a9bfd4; }
.syslog .t { color: #5f7690; }

/* 圖表 */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tt { position: absolute; pointer-events: none; background: #e6edf5; color: #0b1016; border-radius: 8px; padding: 6px 9px; font-size: 12px; display: none;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); white-space: nowrap; z-index: 3; }
.chart .tt b { font-size: 14px; }
.chart .tt .key { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
.ckey { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
.ckey span::before { content: ''; display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); border-radius: 1px; }

/* 平面圖編輯 */
.ed-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; }
@media (max-width: 1000px) { .ed-grid { grid-template-columns: 1fr; } }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tools button.on { border-color: var(--accent); background: var(--accent-soft); }
.ed-svg { cursor: crosshair; }
.ed-svg .bay { cursor: move; }
.ed-svg .handle { fill: #e6edf5; stroke: #0b1016; cursor: nwse-resize; }
.ed-svg .bay rect.b { fill: rgba(57, 135, 229, 0.16); stroke: #3987e5; }
.ed-svg .bay.ev rect.b { fill: rgba(57, 135, 229, 0.32); }
.ed-svg .bay.moto rect.b { fill: rgba(217, 89, 38, 0.18); stroke: #d95926; }
.ed-svg .bay.sel rect.b { stroke: #e6edf5; }
.ed-svg .bay.lock rect.b { stroke-dasharray: 5 3; }
.panel { position: relative; }
.btn.ghost.on { border-color: var(--accent); background: var(--accent-soft); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

/* v4：入口顯示屏（LED 牌風格）+ QR */
.sign { display: flex; gap: 12px; align-items: stretch; background: #05080c; border: 2px solid #1d2a38; border-radius: 10px; padding: 12px 14px; }
.sign .sg-l { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.sign .sg-big { font-size: 30px; font-weight: 800; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.sign.ok .sg-big { color: #3ee03e; text-shadow: 0 0 12px rgba(62, 224, 62, 0.35); }
.sign.full .sg-big { color: #ff5a5a; text-shadow: 0 0 12px rgba(255, 90, 90, 0.35); }
.sign .sg-sub { font-size: 15px; color: #ffd36a; font-weight: 600; }
.sign .sg-ev { font-size: 13px; color: #cfe0f2; }
.sign .sg-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.sign .sg-qr { width: 104px; flex: none; background: #fff; border-radius: 6px; padding: 4px; display: grid; place-items: center; color: #111; font-size: 11px; }
.sign .sg-qr svg { width: 96px; height: 96px; display: block; }
/* 列印入口 QR 牌 */
#poster { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(5, 8, 12, 0.7); overflow-y: auto; padding: 24px 12px; }
#poster.on { display: block; }
.poster-wrap { max-width: 420px; margin: 0 auto; }
.poster { background: #fff; border-radius: 16px; padding: 26px 24px; text-align: center; color: #1c2430; border: 3px solid #1f5fb0; }
.poster .p-tag { display: inline-block; background: #e3eefc; color: #1f5fb0; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
.poster .p-shop { font-size: 22px; font-weight: 800; margin-top: 8px; }
.poster .p-big { font-size: 34px; font-weight: 900; color: #1f5fb0; line-height: 1.2; margin: 8px 0 4px; }
.poster .p-desc { font-size: 16px; margin-bottom: 10px; }
.poster .p-qr svg { width: 230px; height: 230px; }
.poster .p-how { font-size: 13px; color: #445; margin-top: 8px; line-height: 1.6; }
@media print {
  body > *:not(#poster) { display: none !important; }
  body { background: #fff !important; }
  #poster { position: static; background: none; padding: 0; display: block !important; }
  .no-print { display: none !important; }
}

/* v5：設定 → 閘口鏡頭 → 手機做鏡頭 QR */

// 讀 CSV（支援引號、逗號、換行；第一行係標題）
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const clean = rows.filter(r => r.some(x => x.trim() !== ''));
  if (!clean.length) return [];
  const head = clean[0].map(h => h.trim().toLowerCase());
  return clean.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}

let refreshTimer = null;

async function refresh() {

  try {
    const L = await rpc('ps_cp_live', { p_location: CP.loc });
    if (CP.tab !== 'console' || !$('kstrip')) return;
    CP.live = L;
    $('ld').classList.remove('off'); $('ld').textContent = '監控中';
    renderKpis(L); renderLevels(L); renderFloor(L); renderReads(L); renderQueue(L); renderCharts(L); setupCams(L); renderDetail();

    syslog('⚠️ 讀取失敗：' + e.message, 'r-bad');

  }
}

  const total = r.total + (ev ? ev.total : 0), occ = total - r.available - (ev ? ev.available : 0);
  const pct = total ? Math.round(occ / total * 100) : 0, held = r.held + (ev ? ev.held : 0), q = r.queue + (ev ? ev.queue : 0);

// ---------- 圖表（SVG，自己畫；一條 y 軸、hover 十字線） ----------
function lineChart(el, { labels, series, yMax, yFmt = v => v, area = false }) {
  const W = 460, H = 150, m = { l: 34, r: 40, t: 10, b: 22 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = labels.length;
  if (!n) { el.innerHTML = '<p class="small muted">今日未有數據</p>'; return; }
  const top = Math.max(yMax ?? 0, ...series.flatMap(s => s.values), 1);
  const nice = yMax ?? (top <= 4 ? 4 : top <= 10 ? 10 : Math.ceil(top / 5) * 5);
  const X = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1)), Y = v => m.t + ih - (v / nice) * ih;
  const ticks = [0, nice / 2, nice];
  const grid = ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${m.l - 6}" y="${Y(t)}" fill="var(--muted)" font-size="10" text-anchor="end" dominant-baseline="middle">${yFmt(Math.round(t * 10) / 10)}</text>`).join('');
  const step = n > 7 ? Math.ceil(n / 6) : 1;
  const xl = labels.map((l, i) => (i % step === 0 && n - 1 - i >= step) || i === n - 1 ? `<text x="${X(i)}" y="${H - 6}" fill="var(--muted)" font-size="10" text-anchor="middle">${esc(l)}</text>` : '').join('');
  const paths = series.map(s => {
    const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    const a = area ? `<path d="${d}L${X(n - 1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="${s.color}" opacity="0.1"/>` : '';
    const last = s.values[n - 1];
    return `${a}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(n - 1)}" cy="${Y(last)}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;
  }).join('');
  // 直接標示最尾數值（兩條線太近就唔標，靠圖例同提示）
  const ends = series.map(s => ({ s, y: Y(s.values[n - 1]) }));
  const clash = ends.length > 1 && Math.abs(ends[0].y - ends[1].y) < 14;
  const endLabels = clash ? '' : ends.map(({ s, y }) => `<text x="${X(n - 1) + 8}" y="${y}" fill="var(--ink)" font-size="11" dominant-baseline="middle">${yFmt(s.values[n - 1])}</text>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join('、'))}">${grid}
    <line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)" stroke-width="1"/>${xl}${paths}${endLabels}
    <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="tt"></div>`;
  const svg = el.querySelector('svg'), xh = el.querySelector('.xh'), tt = el.querySelector('.tt');
  const show = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / (n === 1 ? 1 : iw / (n - 1)))));
    xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('visibility', 'visible');
    tt.innerHTML = '';
    const head = document.createElement('div'); head.className = 'small'; head.textContent = labels[i]; tt.appendChild(head);
    series.forEach(s => {
      const row = document.createElement('div'), key = document.createElement('span'), val = document.createElement('b'), nm = document.createElement('span');
      key.className = 'key'; key.style.background = s.color; val.textContent = yFmt(s.values[i]); nm.textContent = ' ' + s.name;
      row.append(key, val, nm); tt.appendChild(row);
    });
    tt.style.display = 'block';
    const left = X(i) * r.width / W;
    tt.style.left = Math.min(left + 10, r.width - tt.offsetWidth) + 'px'; tt.style.top = '4px';
  };
  const hide = () => { xh.setAttribute('visibility', 'hidden'); tt.style.display = 'none'; };
  const hit = el.querySelector('.hit');
  hit.onpointermove = show; hit.onpointerleave = hide;
}
function renderCharts(L) {
  const nowH = +new Date().toLocaleString('en-GB', { hour: '2-digit', hour12: false, timeZone: 'Asia/Hong_Kong' }) % 24;
  const hrs = L.hourly.filter(x => x.h <= nowH && x.h > nowH - 12);
  const labels = hrs.map(x => String(x.h).padStart(2, '0') + ':00');
  lineChart($('ch1'), { labels, series: [{ name: '入閘', color: 'var(--s1)', values: hrs.map(x => x.in) }, { name: '出閘', color: 'var(--s2)', values: hrs.map(x => x.out) }] });
  // 佔用率：由而家有幾多車，倒推每個鐘尾
  const bays = L.bays.filter(b => b.status !== 'disabled');
  const total = bays.length || (L.location.regular.total + (L.location.ev?.total || 0));
  const occNow = bays.length ? bays.filter(b => b.status === 'occupied').length : total - L.location.regular.available - (L.location.ev?.available || 0);
  const occ = []; let o = occNow;
  for (let i = hrs.length - 1; i >= 0; i--) { occ[i] = Math.max(0, Math.min(total, o)); o -= hrs[i].in - hrs[i].out; }
  const pct = occ.map(v => total ? Math.round(v / total * 100) : 0);
  lineChart($('ch2'), { labels, series: [{ name: '佔用率', color: 'var(--s1)', values: pct }], yMax: 100, yFmt: v => v + '%', area: true });
  $('chtbl').innerHTML = `<div class="tbl-wrap dark" style="max-height:200px"><table><thead><tr><th>時間</th><th class="num">入閘</th><th class="num">出閘</th><th class="num">佔用率</th></tr></thead><tbody>
    ${hrs.map((x, i) => `<tr><td>${labels[i]}</td><td class="num">${x.in}</td><td class="num">${x.out}</td><td class="num">${pct[i]}%</td></tr>`).join('')}</tbody></table></div>`;
}

  const x1 = c1.getContext('2d'); x1.fillStyle = '#0d141c'; x1.fillRect(0, 0, c1.width, c1.height);
  x1.save(); x1.filter = conf < 0.6 ? 'blur(1.6px)' : 'blur(0.7px)'; x1.translate(c1.width * 0.5, c1.height * 0.5);

// 自動模擬：按佔用率決定入定出
function simTick() {
  if (!CP.sim.speed || !CP.live || CP.tab !== 'console') return;
  const now = Date.now();
  if (now < CP.sim.next) return;
  CP.sim.next = now + (1800 + Math.random() * 2600) / CP.sim.speed;
  const L = CP.live, loc = L.location;
  const carIn = pickCam('entry', 'regular'), carOut = pickCam('exit', 'regular');
  const motoIn = pickCam('entry', 'motorcycle'), motoOut = pickCam('exit', 'motorcycle');
  const camBusy = c => !c || c.cur || c.q.length > 0;
  if (motoIn && Math.random() < 0.16) {
    const mb = L.bays.filter(b => b.kind === 'motorcycle');
    const occM = mb.filter(b => b.status === 'occupied' && !inFlight(b.id));
    if (occM.length && (Math.random() < occM.length / Math.max(1, mb.length) || !mb.some(b => b.status === 'free'))) {
      const b = occM[Math.floor(Math.random() * occM.length)];
      if (!camBusy(motoOut)) spawn(motoOut, exitVeh(b, 0.96));
    } else if (!camBusy(motoIn) && mb.some(b => b.status === 'free')) spawn(motoIn, { plate: randPlate(), type: 'motorcycle', conf: 0.9 + Math.random() * 0.09 });
    return;
  }
  const total = loc.regular.total + (loc.ev?.total || 0), avail = loc.regular.available + (loc.ev?.available || 0);
  const occRate = total ? 1 - avail / total : 0;
  const outs = L.bays.filter(b => b.status === 'occupied' && b.kind !== 'motorcycle' && (b.source === 'walk_in' || CP.sim.booked) && !inFlight(b.id));
  const pIn = loc.regular.free + (loc.ev?.free || 0) > 0 ? Math.max(0.15, Math.min(0.9, 0.5 + (0.78 - occRate) * 1.4)) : 0.2;
  const goIn = Math.random() < pIn || !outs.length;
  if (goIn && !camBusy(carIn)) {
    const lowConf = Math.random() < 0.07;
    const ev = loc.ev && Math.random() < 0.14;
    spawn(carIn, { plate: randPlate(), type: ev ? 'ev' : 'regular', conf: lowConf ? 0.42 + Math.random() * 0.16 : 0.88 + Math.random() * 0.11 });
  } else if (!goIn && !camBusy(carOut)) {
    spawn(carOut, exitVeh(outs[Math.floor(Math.random() * outs.length)], 0.97));
  }
}
const inFlight = bayId => CP.cams.some(c => (c.cur && c.cur.bayId === bayId) || c.q.some(v => v.bayId === bayId));
const exitVeh = (b, conf) => ({ bayId: b.id, bayCode: b.code, plate: platesSeen[plateKey(b.code)] || b.plate || '•••', type: b.kind, conf });

function nextFree(pre) {

}

  return new Promise((ok, bad) => {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { bad(new Error('只接受 PNG／JPG／WebP')); return; }
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => {
      let s = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight)), out = '';
      for (let i = 0; i < 6; i++) {
        const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', 0.82);
        if (out.length <= maxChars) { URL.revokeObjectURL(url); ok({ url: out, w: c.width, h: c.height }); return; }
        s *= 0.75;

// 柱狀圖：一個系列（唔使圖例），hover 每條柱有數字，最高嗰條直接標數
function barChart(el, { labels, full, values }) {
  const W = 460, H = 180, m = { l: 34, r: 10, t: 16, b: 26 }, iw = W - m.l - m.r, ih = H - m.t - m.b, n = values.length;
  const max = Math.max(1, ...values), p10 = 10 ** Math.floor(Math.log10(max));
  const step = [1, 2, 5, 10].map(x => x * p10).find(st => Math.ceil(max / st) <= 5), nice = Math.ceil(max / step) * step;   // 整數刻度：1、2、5 × 10ⁿ
  const Y = v => m.t + ih - v / nice * ih, slot = iw / n, bw = Math.min(40, slot * 0.62);
  const grid = Array.from({ length: nice / step + 1 }, (_, i) => i * step).map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/>
    <text x="${m.l - 6}" y="${Y(t)}" fill="var(--muted)" font-size="10" text-anchor="end" dominant-baseline="middle">${Math.round(t)}</text>`).join('');
  const top = values.indexOf(max);
  const bars = values.map((v, i) => {
    const x = m.l + i * slot + (slot - bw) / 2, y = Y(v), h = Math.max(0, Y(0) - y), r = Math.min(4, h, bw / 2);
    const path = h > 0 ? `M${x},${Y(0)}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${Y(0)}Z` : '';
    return `<path d="${path}" fill="var(--s1)"/>${i === top && v > 0 ? `<text x="${x + bw / 2}" y="${y - 5}" fill="var(--ink)" font-size="11" text-anchor="middle">${v}</text>` : ''}
      <text x="${x + bw / 2}" y="${H - 8}" fill="var(--muted)" font-size="9.5" text-anchor="middle">${esc(labels[i])}</text>
      <rect class="hit" data-i="${i}" x="${m.l + i * slot}" y="${m.t}" width="${slot}" height="${ih}" fill="transparent"/>`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="泊車時間分佈">${grid}<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)"/>${bars}</svg><div class="tt"></div>`;
  const svg = el.querySelector('svg'), tt = el.querySelector('.tt');
  el.querySelectorAll('.hit').forEach(h => {
    h.onpointermove = () => {
      const i = +h.dataset.i, r = svg.getBoundingClientRect();
      tt.innerHTML = '';
      const a = document.createElement('div'); a.className = 'small'; a.textContent = full[i];
      const b = document.createElement('div'); const v = document.createElement('b'); v.textContent = values[i]; b.append(v, document.createTextNode(' 架次'));
      tt.append(a, b); tt.style.display = 'block';
      const cx = (m.l + (i + 0.5) * slot) * r.width / W;
      tt.style.left = Math.min(Math.max(0, cx - tt.offsetWidth / 2), r.width - tt.offsetWidth) + 'px'; tt.style.top = '0px';
    };
    h.onpointerleave = () => { tt.style.display = 'none'; };
  });
}

        <p class="small" id="fcinfo">讀緊…</p>
        <p class="small muted">夠 30 次泊車記錄之後，系統用存活分析：按場內每架車已經泊咗幾耐，估計佢幾時走，模擬 200 次得出「排第幾位大約等幾耐」同範圍。記錄唔夠就用平均出閘間隔。</p>
        <div class="btns"><button class="btn ghost sm" id="demogen">產生 14 日示範記錄</button><button class="btn ghost sm" id="democlr">清除示範記錄</button></div>
        <p class="small muted">示範記錄標明「示範」，只用嚟示範預測，報表唔會計，可以隨時清走。</p></div></div>` : ''}
    ${provs.length ? `<div class="grid2" style="margin-top:14px">
      <div class="panel"><div class="ph"><h2>➕ 新增停車場</h2></div>
        <form class="form" data-add>${provs.length > 1 ? `<label class="f">公司<select name="prov">${provs.map(p => `<option value="${p.id}">${esc(p.company_name)}</option>`).join('')}</select></label>` : ''}
          <label class="f">名稱<input name="name" required maxlength="120"></label><label class="f">地址<input name="address" maxlength="200"></label>
          <div class="row"><label class="f">地區<input name="district" maxlength="40"></label><label class="f">運輸署編號（可以唔填）<input name="ext_park_id" maxlength="40"></label></div>
          <div class="row"><label class="f">緯度<input name="latitude" required placeholder="22.3193"></label><label class="f">經度<input name="longitude" required placeholder="114.1694"></label></div>
          <div class="row"><label class="f">一般車位<input type="number" name="total_spots" min="0" required></label><label class="f">充電車位<input type="number" name="ev_spots" min="0" value="0"></label>
            <label class="f">每小時 $<input type="number" name="hourly_rate" min="0" step="0.5" required></label></div>
          <div class="err" data-err></div><div><button class="btn">提交平台審批</button></div></form></div>
      <div class="panel"><div class="ph"><h2>📄 CSV 一次過上載</h2></div>
        <div class="btns"><button class="btn ghost sm" data-tpl>⬇️ 下載範本</button><label class="btn ghost sm" style="cursor:pointer">📂 揀 CSV 檔<input type="file" accept=".csv,text/csv" data-file hidden></label></div>
        ${provs.length > 1 ? `<label class="f" style="margin-top:10px">公司<select data-csvprov>${provs.map(p => `<option value="${p.id}">${esc(p.company_name)}</option>`).join('')}</select></label>` : ''}
        <div data-preview style="margin-top:12px"></div></div></div>` : ''}
    <div class="panel" style="margin-top:14px"><div class="ph"><h2>提交記錄</h2></div><div class="tbl-wrap dark"><table><thead><tr><th>日期</th><th>檔案</th><th class="num">行數</th><th>狀態</th><th>備註</th></tr></thead><tbody>
      ${h.uploads.map(c => `<tr><td>${dt(c.created_at)}</td><td>${esc(c.file_name)}</td><td class="num">${c.row_count}</td><td>${pill(c.status)}</td><td class="small">${esc(c.notes || '')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">未有</td></tr>'}
    </tbody></table></div></div>`;
  bindLocSelect(app, renderSettings);
  const qf = $('qform');
  if (qf && L) {
    const prev = () => {
      const pct = Math.max(0, Math.min(100, +qf.pct.value || 0)), tot = L.regular.total;
      $('qprev').textContent = pct >= 100 ? '唔限：全部車位都可以預約。' : `一般車位 ${tot} 個：最多 ${Math.floor(tot * pct / 100)} 個可以預約，至少 ${tot - Math.floor(tot * pct / 100)} 個留畀即場。`;
    };
    qf.r.oninput = () => { qf.pct.value = qf.r.value; prev(); };
    qf.pct.oninput = () => { qf.r.value = qf.pct.value; prev(); };
    prev();
    qf.onsubmit = e => { e.preventDefault(); busy(qf.querySelector('button'), async () => {
      $('qerr').textContent = '';
      try { await rpc('ps_cp_set_quota', { p_location: CP.loc, p_pct: Math.round(+qf.pct.value) }); toast('✅ 已儲存預約上限'); await cpLoad(true); renderSettings(); }
      catch (err) { $('qerr').textContent = err.message; }
    }); };
    rpc('ps_cp_live', { p_location: CP.loc }).then(lv => {
      const f = lv.forecast?.regular, el = $('fcinfo');
      const n = lv.forecast?.samples ?? 0;
      if (el) el.innerHTML = !f ? '未有資料。' : f.method === 'survival' ? `而家用 <b>存活分析</b>（${n} 次泊車記錄）。下一架車預計 ${esc(waitText(f))} 後走。`
        : n >= 30 ? `有 ${n} 次泊車記錄；而家場內冇車，所以暫時用 <b>平均出閘間隔</b>。有車入場之後會自動轉用存活分析。`
        : `而家用 <b>平均出閘間隔</b>（只有 ${n} 次泊車記錄，要 30 次先用存活分析）。`;
    }).catch(() => {});
    $('demogen').onclick = e => busy(e.currentTarget, async () => {
      try { const r = await rpc('ps_cp_demo_history', { p_location: CP.loc, p_days: 14 }); toast(`✅ 產生咗 ${r.rows} 架次示範記錄`, 4000); renderSettings(); }
      catch (err) { toast('⚠️ ' + err.message, 4000); }
    });
    $('democlr').onclick = e => busy(e.currentTarget, async () => {
      try { const r = await rpc('ps_cp_demo_clear', { p_location: CP.loc }); toast(`已清走 ${r.rows} 架次示範記錄`, 4000); renderSettings(); }
      catch (err) { toast('⚠️ ' + err.message, 4000); }
    });
  }
  const ef = app.querySelector('[data-edit]');
  if (ef) ef.onsubmit = e => { e.preventDefault(); busy(ef.querySelector('button'), async () => {
    const d = formData(ef);
    try {
      await rpc('ps_op_update_location', { p_location: CP.loc, p_name: d.name, p_address: d.address, p_district: d.district, p_total: +d.total, p_ev: +d.ev,
        p_rate: +d.rate, p_grace: +d.grace, p_pricing_info: d.pricing, p_active: !!d.active });
      toast('✅ 已儲存'); await cpLoad(true); renderSettings();
    } catch (err) { ef.querySelector('[data-err]').textContent = err.message; }
  }); };
  if (L) {
    const draw = () => {
      $('camlist').innerHTML = cams.map((c, i) => `<div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px" data-ci="${i}">
        <div class="row" style="display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:6px;align-items:end">
          <label class="f">名稱<input data-k="name" value="${esc(c.name)}" maxlength="30"></label>
          <label class="f">方向<select data-k="direction"><option value="entry" ${c.direction === 'entry' ? 'selected' : ''}>入口</option><option value="exit" ${c.direction === 'exit' ? 'selected' : ''}>出口</option></select></label>
          <label class="f">車種<select data-k="default_type">${Object.entries(KIND).map(([k, n]) => `<option value="${k}" ${c.default_type === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
          <button class="btn ghost sm" data-del="${i}">🗑</button></div>
        <div class="row" style="display:grid;grid-template-columns:repeat(4,1fr) 2fr;gap:6px;margin-top:6px">
          ${['x1', 'y1', 'x2', 'y2'].map(k => `<label class="f">ROI ${k}<input type="number" step="0.01" min="0" max="1" data-roi="${k}" value="${(+c.roi[k]).toFixed(2)}"></label>`).join('')}
          <label class="f">串流位址（Python 用）<input data-k="stream_hint" value="${esc(c.stream_hint || '')}" placeholder="rtsp://… 或 0（webcam）" maxlength="200"></label></div>
        <div class="small muted" style="margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">鏡頭 ID：<b class="mono">${c.id ?? '（儲存後先有）'}</b>
          ${c.id ? `<button class="btn ghost sm" type="button" data-phone="${i}">📱 手機做鏡頭</button>` : ''}</div><div data-qr hidden></div></div>`).join('') || '<p class="small muted">未有鏡頭</p>';
      $('camlist').querySelectorAll('[data-ci]').forEach(row => {
        const c = cams[+row.dataset.ci];
        row.querySelectorAll('[data-k]').forEach(inp => inp.onchange = () => { c[inp.dataset.k] = inp.value; });
        row.querySelectorAll('[data-roi]').forEach(inp => inp.onchange = () => { c.roi = { ...c.roi, [inp.dataset.roi]: +inp.value }; });
        row.querySelector('[data-del]').onclick = () => { cams.splice(+row.dataset.ci, 1); draw(); };
        const ph = row.querySelector('[data-phone]'), box = row.querySelector('[data-qr]');
        if (ph) ph.onclick = () => busy(ph, async () => {
          if (!box.hidden) { box.hidden = true; return; }
          const url = gateUrl(c.id);
          try { box.innerHTML = `<div class="gate-qr"><div class="sg-qr">${await qrSvg(url)}</div><div class="small"><b>用舊手機相機掃呢個 QR</b>，用職員帳戶登入，就變成「${esc(c.name)}」。
            <br><span class="muted">要 iPhone iOS 16.4 或以上（或者新版 Android Chrome）；第一次要下載約 22 MB 模型。</span><br><a href="${esc(url)}" target="_blank" rel="noopener" class="mono">${esc(url)}</a></div></div>`; }
          catch (err) { box.innerHTML = `<div class="small"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>`; }
          box.hidden = false;
        });
      });
    };
    draw();
    $('camadd').onclick = () => { if (cams.length >= 9) return; cams.push({ name: `CAM-0${cams.length + 1}`, direction: 'entry', default_type: 'regular', roi: { x1: 0.2, y1: 0.35, x2: 0.8, y2: 0.9 }, is_active: true }); draw(); };
    $('camsave').onclick = e => busy(e.currentTarget, async () => {
      $('camerr').textContent = '';
      try { cams = await rpc('ps_cp_save_cameras', { p_location: CP.loc, p_cameras: cams }); toast('✅ 已儲存鏡頭'); CP.camSig = null; draw(); }
      catch (err) { $('camerr').textContent = err.message; }
    });
  }
  const submitRows = async (prov, name, rows, errBox) => {
    const r = await rpc('ps_op_submit_locations', { p_provider: prov, p_file_name: name, p_rows: rows });
    if (!r.ok) { errBox.innerHTML = '有資料唔啱，未提交：<br>' + r.errors.map(x => `第 ${x.row} 行：${x.errors.map(esc).join('、')}`).join('<br>'); return; }
    toast(`✅ 已提交 ${r.rows} 個停車場，等平台審批`, 4000); await cpLoad(true); renderSettings();
  };
  const af = app.querySelector('[data-add]');
  if (af) af.onsubmit = e => { e.preventDefault(); busy(af.querySelector('button'), async () => {
    const d = formData(af), errBox = af.querySelector('[data-err]'); errBox.textContent = '';
    const row = Object.fromEntries(CSV_COLS.map(k => [k, (d[k] ?? '').trim()]));
    try { await submitRows(+(d.prov || provs[0].id), '手動輸入：' + row.name, [row], errBox); } catch (err) { errBox.textContent = err.message; }
  }); };
  app.querySelector('[data-tpl]')?.addEventListener('click', () => download('parksmart-carparks-template.csv', CSV_COLS.join(',') + '\n好停車旺角,旺角道 1 號,油尖旺,22.3193,114.1694,120,6,28,\n'));
  const fi = app.querySelector('[data-file]');
  if (fi) fi.onchange = async () => {
    const f = fi.files[0]; if (!f) return;
    if (f.size > 500 * 1024) { toast('⚠️ 檔案太大（最大 500 KB）', 4000); return; }
    CP.csvRows = parseCsv(await f.text()); CP.csvName = f.name;
    const box = app.querySelector('[data-preview]');
    const missing = ['name', 'latitude', 'longitude', 'total_spots', 'hourly_rate'].filter(k => CP.csvRows.length && !(k in CP.csvRows[0]));
    if (!CP.csvRows.length || missing.length) { box.innerHTML = `<div class="err">讀唔到資料${missing.length ? '：缺少欄位 ' + missing.join('、') : ''}</div>`; return; }
    box.innerHTML = `<p class="small"><b>${esc(f.name)}</b>：${CP.csvRows.length} 行</p><div class="tbl-wrap dark"><table><thead><tr>${CSV_COLS.map(k => `<th>${CSV_LABEL[k]}</th>`).join('')}</tr></thead><tbody>
      ${CP.csvRows.slice(0, 20).map(r => `<tr>${CSV_COLS.map(k => `<td class="small">${esc(r[k] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="err" data-err style="margin-top:8px"></div><button class="btn" data-send style="margin-top:10px">提交平台審批</button>`;
    box.querySelector('[data-send]').onclick = e => busy(e.currentTarget, async () => {
      const errBox = box.querySelector('[data-err]'); errBox.textContent = '';
      try { await submitRows(+(app.querySelector('[data-csvprov]')?.value || provs[0].id), CP.csvName, CP.csvRows.map(r => Object.fromEntries(CSV_COLS.map(k => [k, r[k] ?? '']))), errBox); }
      catch (err) { errBox.textContent = err.message; }
    });
  };
}

portalStart(AUTH_OPTS);

</script>
</body>
</html>
